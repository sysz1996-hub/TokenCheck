name: Build Android APK (Qt 6.8.2)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Qt 6.8.2 for Android (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true

      - name: Set up Android SDK and Build-Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install Android NDK r26b
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install OpenSSL 3 for Android
        run: |
          git clone --depth 1 https://github.com/KDAB/android_openssl.git "$ANDROID_SDK_ROOT/android_openssl"
          if [ ! -d "$ANDROID_SDK_ROOT/android_openssl/no-asm/ssl_3" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/android_openssl/no-asm/ssl_3"
            cp -r "$ANDROID_SDK_ROOT/android_openssl/ssl_3/." "$ANDROID_SDK_ROOT/android_openssl/no-asm/ssl_3/"
          fi

      - name: Configure
        working-directory: TokenCheckAndroid
        run: |
          QTC="$(find "$QT_ROOT_DIR" -name qt-cmake -type f | head -1)"
          echo "Using: $QTC"
          "$QTC" -S . -B build \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build and package APK
        working-directory: TokenCheckAndroid
        run: cmake --build build --config Release --parallel

      - name: Locate APK
        run: find TokenCheckAndroid/build -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenCheck-android-arm64-v8a
          path: TokenCheckAndroid/build/**/*.apk
          if-no-files-found: error
