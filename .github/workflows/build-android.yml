name: Build Android APK (Qt 6.8)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK inside Qt-for-Android container
        run: |
          docker run --rm --user root \
            -e HOME=/root \
            -v "$GITHUB_WORKSPACE":/ws \
            -w /ws/TokenCheckAndroid \
            stateoftheartio/qt6:6.8-android-aqt \
            bash -lc '
              set -e
              echo "QT_ANDROID=$QT_ANDROID ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
              java -version
              rm -rf "$ANDROID_SDK_ROOT/android_openssl"
              git clone --depth 1 https://github.com/KDAB/android_openssl.git "$ANDROID_SDK_ROOT/android_openssl"
              ls -l "$ANDROID_SDK_ROOT/android_openssl/no-asm/ssl_3/arm64-v8a"
              QTC="$(find ${QT_ANDROID:-/opt/Qt} -name qt-cmake -type f | head -1)"
              echo "Using $QTC"
              "$QTC" -S . -B build -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-34 -DCMAKE_BUILD_TYPE=Release
              cmake --build build --config Release --parallel
              find build -name "*.apk" -exec ls -lh {} \;
            '

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenCheck-android-arm64-v8a
          path: TokenCheckAndroid/build/**/*.apk
          if-no-files-found: error
